name: Build Release

# 推送 tag（如 v1.0.0）即自动交叉编译各平台单文件可执行程序并创建 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64,        name: linux_amd64 }
          - { goos: linux,   goarch: arm64,        name: linux_arm64 }
          - { goos: linux,   goarch: arm, goarm: "7", name: linux_armv7 }
          - { goos: linux,   goarch: arm, goarm: "5", name: linux_armv5 }
          - { goos: linux,   goarch: "386",        name: linux_386 }
          - { goos: linux,   goarch: mipsle,       name: linux_mipsle }
          - { goos: windows, goarch: amd64,        name: windows_amd64 }
          - { goos: darwin,  goarch: arm64,        name: darwin_arm64 }
    steps:
      # fetch-depth: 0 —— 必须拿全量历史与所有 tag，否则下面的 git tag / git log
      # 拿不到上一个 tag，更新日志永远注入不进去（默认只取触发的那一个 ref）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          # 把提交清单格式化成「- 标题 + 两空格缩进正文」；正文跳过空行与签名，
          # 单条最多 12 行。此前只注入标题，提交正文里的详细修复清单全部丢失。
          # 注意：python 脚本经 heredoc 写盘再执行 —— -c '...' 的零缩进行会截断 YAML 块
          cat > /tmp/fmt_changelog.py <<'PYEOF'
          import sys
          out = []
          for blk in sys.stdin.read().split("\x00"):
              lines = blk.replace("\r", "").split("\n")
              subject = lines[0].strip()
              if not subject:
                  continue
              out.append("- " + subject)
              shown = 0
              for ln in lines[1:]:
                  t = ln.strip()
                  if not t or t.startswith("Signed-off-by:"):
                      continue
                  if shown >= 12:
                      out.append("  …")
                      break
                  out.append("  " + t)
                  shown += 1
          print("\n".join(out))
          PYEOF
          format_changelog() {
            git log --pretty=format:'%x00%s%n%b' "$1" | python3 /tmp/fmt_changelog.py
          }
          out=fileserver_${{ matrix.name }}
          if [ "${{ matrix.goos }}" = "windows" ]; then out="${out}.exe"; fi
          # 必须注入 goarmBuild：运行期 assetName() 靠它拼出 fileserver_linux_armv5/v7，
          # 缺失时 armv7 设备自更新会下载 armv5 产物（魔数校验能过，架构却是错的）
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=$(git rev-parse --short HEAD) -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "${GOARM:-}" ]; then LDFLAGS="${LDFLAGS} -X main.goarmBuild=${GOARM}"; fi
          # 注入更新日志：上一 tag 到本 tag 的提交清单（含提交正文），程序内「检查更新」页离线展示。
          # ldflags -X 不能直接带换行/引号/特殊字符（eval 重解析会炸），
          # 改用 base64 编码后注入，运行期 main.go 里解码还原。
          # 没有上一个 tag（仓库首个发布）时退化为「全部提交」，
          # 否则程序内更新日志会是空的，只能看到 GitHub 自动生成的 Full Changelog 链接
          CHANGELOG_B64=""
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -n "${PREV_TAG}" ]; then
            HEADER="本次更新（${PREV_TAG} → ${GITHUB_REF_NAME}）的提交："
            CHANGELOG=$(format_changelog "${PREV_TAG}..${GITHUB_REF_NAME}" | head -100)
          else
            HEADER="本次发布（${GITHUB_REF_NAME}）包含的提交："
            CHANGELOG=$(format_changelog "-30" | head -100)
          fi
          if [ -n "${CHANGELOG}" ]; then
            CHANGELOG_B64=$(printf '%s\n%s' "${HEADER}" "${CHANGELOG}" | base64 -w0 || true)
            LDFLAGS="${LDFLAGS} -X main.changelogB64=${CHANGELOG_B64}"
          fi
          go build -trimpath -ldflags "${LDFLAGS}" -o "$out" .
          # 注意：${#VAR:-0} 不是合法参数展开（bash 报 bad substitution），
          # GitHub Actions 的 run 默认 bash -eo pipefail，会直接让整个 Build 步骤失败。
          # 取长度必须先给变量默认值，再单独用 ${#VAR}
          echo "已构建 ${out}（GOARM=${GOARM:-未设置}，changelogB64 ${#CHANGELOG_B64} 字符）"
          mkdir -p dist
          mv "$out" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fileserver_${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout + 全量历史：Release 说明在创建时就写入完整提交清单（含正文）。
      # 直接 push（无 PR）时 GitHub 自动生成的说明只有一行 Full Changelog 链接，
      # 已发布的旧版本客户端会拿它当「新版本更新内容」展示 —— 说明本身必须完整，
      # 老版本不做任何升级也能读到全部更新内容
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生成 Release 说明（含提交正文）
        run: |
          cat > /tmp/fmt_changelog.py <<'PYEOF'
          import sys
          out = []
          for blk in sys.stdin.read().split("\x00"):
              lines = blk.replace("\r", "").split("\n")
              subject = lines[0].strip()
              if not subject:
                  continue
              out.append("- " + subject)
              shown = 0
              for ln in lines[1:]:
                  t = ln.strip()
                  if not t or t.startswith("Signed-off-by:"):
                      continue
                  if shown >= 12:
                      out.append("  …")
                      break
                  out.append("  " + t)
                  shown += 1
          print("\n".join(out))
          PYEOF
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -n "${PREV_TAG}" ]; then
            HEADER="## 本次更新内容（${PREV_TAG} → ${GITHUB_REF_NAME}）"
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            COMPARE="完整变更：https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          else
            HEADER="## 本次发布（${GITHUB_REF_NAME}）包含的提交"
            RANGE="-30"
            COMPARE=""
          fi
          {
            echo "${HEADER}"
            echo ""
            git log --pretty=format:'%x00%s%n%b' ${RANGE} | python3 /tmp/fmt_changelog.py
            if [ -n "${COMPARE}" ]; then
              echo ""
              echo "${COMPARE}"
            fi
          } > body.md
          cat body.md
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: body.md
          # 关闭自动生成：直接 push 仓库生成的只有一行 Full Changelog，
          # 会作为噪音混进旧版本客户端展示的说明里；compare 链接已在 body 中给出
          generate_release_notes: false
