# /etc/nginx/conf.d/fileserver.conf
# 反代文件服务；注意大文件上传/下载的关键参数已放开
server {
    listen 80;
    server_name file.example.com;      # ← 改成你的域名

    # 如需强制 https，取消下一行注释（证书用 certbot 签发）
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name file.example.com;      # ← 改成你的域名

    # ssl_certificate     /etc/letsencrypt/live/file.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/file.example.com/privkey.pem;

    # 上传大小：0 = 不限制
    client_max_body_size 0;
    # 大文件下载不建议缓冲，避免占用内存与磁盘
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:16666;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;   # 让分享链接生成 https://
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
